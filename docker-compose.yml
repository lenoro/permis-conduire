version: '3.8'

services:
  permis_db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: permis_db
      POSTGRES_USER: permis_user
      POSTGRES_PASSWORD: Permis2026!
    volumes:
      - permis_db_data:/var/lib/postgresql/data
    networks:
      - permis_net

  permis_backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://permis_db:5432/permis_db
      SPRING_DATASOURCE_USERNAME: permis_user
      SPRING_DATASOURCE_PASSWORD: Permis2026!
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - permis_db
    networks:
      - permis_net

  permis_frontend:
    build: ./frontend/permis-app
    restart: unless-stopped
    networks:
      - permis_net
      - proxy_net

networks:
  permis_net:
  proxy_net:
    external: true

volumes:
  permis_db_data:
